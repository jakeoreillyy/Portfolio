<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The title, description, canonical and og:title/description/url below
         are dev-server defaults. Each built page gets its own set, written in
         from src/lib/routeMeta.ts, so edit them there. -->
    <meta
      name="description"
      content="Jake O'Reilly, software engineer based in Dublin, Ireland. Explore projects, work experience, education, and skills, or get in touch directly."
    />
    <meta name="theme-color" content="#000000" />
    <meta name="robots" content="noimageindex" />
    <link rel="canonical" href="https://www.jakeoreilly.dev/" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />

    <!-- Link previews (LinkedIn, iMessage, Discord, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.jakeoreilly.dev/" />
    <meta property="og:title" content="Jake O'Reilly, Software Engineer" />
    <meta
      property="og:description"
      content="Computer science student and software engineer in Dublin. Projects, experience, and how to get in touch."
    />
    <meta property="og:image" content="https://www.jakeoreilly.dev/social-preview.png" />
    <meta property="og:image:width" content="1902" />
    <meta property="og:image:height" content="982" />
    <meta
      property="og:image:alt"
      content="The jakeoreilly.dev homepage: a dark terminal-styled hero reading 'Jake O'Reilly, software engineer'"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Identity schema: tells search engines and LLMs who this site is about -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jake O'Reilly",
        "url": "https://www.jakeoreilly.dev/",
        "jobTitle": "Software Engineer",
        "description": "Software engineer and computer science student based in Dublin, Ireland.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Dublin",
          "addressCountry": "IE"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Technological University Dublin"
        },
        "sameAs": [
          "https://github.com/jakeoreillyy",
          "https://www.linkedin.com/in/jake-o-reilly",
          "https://x.com/jakeorei",
          "https://leetcode.com/u/jakeoreilly/"
        ]
      }
    </script>

    <title>Jake O'Reilly | Software Engineer in Dublin, Ireland</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
